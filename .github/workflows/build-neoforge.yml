name: Build NeoForge

on:
  pull_request:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build NeoForge (retry dependency failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace :common:test :neoforge:build; then
              exit 0
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            echo "Build attempt ${attempt} failed; clearing dependency caches before retry."
            rm -rf ~/.gradle/caches/modules-2/files-2.1
            sleep $((attempt * 15))
          done
      - name: Verify release JAR
        shell: bash
        run: |
          mapfile -t jars < <(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev-*' ! -name '*-sources.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -t "$jar"
          unzip -l "$jar" | grep -q 'META-INF/neoforge.mods.toml'
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -Eq 'modId[[:space:]]*=[[:space:]]*"cobble_contests"'
          printf 'RELEASE_JAR=%s\n' "$jar" >> "$GITHUB_ENV"
      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: cobble_contests-neoforge-0.3.0
          path: ${{ env.RELEASE_JAR }}
          if-no-files-found: error
